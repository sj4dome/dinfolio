    const urlIsSafe = value => {try{const u=new URL(value);return u.protocol==='https:'||u.protocol==='http:';}catch{return false;}};
    // ใช้ DOM API และ textContent สำหรับข้อมูลโปรเจกต์ (ไม่ใช้ innerHTML)
    function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
    function iconArrow(){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('width','15');svg.setAttribute('height','15');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.8');svg.setAttribute('stroke-linecap','round');svg.setAttribute('aria-hidden','true');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M7 17 17 7M8 7h9v9');svg.append(path);return svg;}
    function makeCard(p,index,categoryName){
      const card=el('article','project');
      const content=el('div','card-content');
      const top=el('div','card-top');
      top.append(el('span','card-eyebrow',categoryName));
      if(!p.url)top.append(el('span','badge',p.unavailable?'ลิงก์เดิมเปิดไม่ได้':'ต้นแบบ · ยังไม่มีลิงก์เว็บ'));
      content.append(top,el('h3','card-title',p.title),el('p','card-desc',p.description));
      const foot=el('div','card-foot');
      if(p.url&&(!p.url||urlIsSafe(p.url))){
        const visit=el('a','visit','เปิดเว็บไซต์');visit.href=p.url;visit.target='_blank';visit.rel='noopener noreferrer';visit.setAttribute('aria-label','เปิด '+p.title+' ในแท็บใหม่');visit.append(iconArrow());foot.append(visit);
      }
      if(p.repo){
        const repo=el('a','repo-link',p.url?'GitHub':'ดูโปรเจกต์บน GitHub');repo.href='https://github.com/sj4dome/'+encodeURIComponent(p.repo);repo.target='_blank';repo.rel='noopener noreferrer';repo.setAttribute('aria-label','ดูโค้ด '+p.title+' บน GitHub ในแท็บใหม่');foot.append(repo);
      }
      if(p.url&&!p.repo)foot.append(el('span','host',new URL(p.url).hostname.replace(/^www\./,'')));
      content.append(foot);card.append(content);return card;
    }
    function drawFilters(){
      filters.replaceChildren();
      const items=[{id:'all',name:'ทั้งหมด'},...CATEGORIES.filter(c=>PROJECTS.some(p=>p.category===c.id))];
      for(const item of items){const count=item.id==='all'?PROJECTS.length:PROJECTS.filter(p=>p.category===item.id).length;const btn=el('button','filter'+(activeCategory===item.id?' active':''));btn.type='button';btn.setAttribute('aria-pressed',String(activeCategory===item.id));btn.append(document.createTextNode(item.name),el('b','',String(count)));btn.addEventListener('click',()=>{activeCategory=item.id;render();filters.querySelector('[aria-pressed="true"]')?.focus({preventScroll:true});});filters.append(btn);}
    }
    function render(){
      const term=search.value.trim().toLocaleLowerCase();
      const matched=PROJECTS.filter(p=>(activeCategory==='all'||p.category===activeCategory)&&(!term||[p.title,p.description,p.tags,p.repo,CATEGORIES.find(c=>c.id===p.category)?.name].join(' ').toLocaleLowerCase().includes(term))&&(!p.url||urlIsSafe(p.url)));
      $('total-count').textContent=String(PROJECTS.length);
      $('results-summary').textContent=term||activeCategory!=='all'?`พบ ${matched.length} จาก ${PROJECTS.length} โปรเจกต์`:`แสดงทั้งหมด ${PROJECTS.length} โปรเจกต์`;
      $('clear-search').classList.toggle('visible',Boolean(search.value));
      drawFilters();groups.replaceChildren();
      let groupNumber=0;
      for(const category of CATEGORIES){const projects=matched.filter(p=>p.category===category.id);if(!projects.length)continue;groupNumber++;
        const section=el('section','group'), head=el('div','group-head'), indexLabel=el('span','group-index',String(groupNumber).padStart(2,'0'));
        head.append(indexLabel,el('h2','',category.name),el('span','group-count',String(projects.length)),el('div','group-rule'));
        const grid=el('div','cards');for(const p of projects)grid.append(makeCard(p,PROJECTS.indexOf(p),category.name));section.append(head,grid);groups.append(section);
      }
      $('no-results').style.display=matched.length?'none':'block';
    }
    function reset(){activeCategory='all';search.value='';render();search.focus();}
    search.addEventListener('input',render);
    $('clear-search').addEventListener('click',()=>{search.value='';render();search.focus();});
    $('reset-filters').addEventListener('click',reset);
    render();
  </script>
</body>
</html>
