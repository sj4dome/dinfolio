name: Portfolio - Automatic Discovery and Link Checks

on:
  # Daily at 08:43 Bangkok time (01:43 UTC), subject to GitHub queue delays.
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync projects and check portfolio links
        run: node scripts/portfolio-sync.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PORTFOLIO_GITHUB_USERNAME: ${{ vars.PORTFOLIO_GITHUB_USERNAME }}
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
